<svg xmlns="http://www.w3.org/2000/svg" width="48.0mm" height="52.4mm" viewBox="0 0 600 655" role="img" aria-labelledby="title desc">
<title id="title">Compact three-state transformer layer</title>
<desc id="desc">Upright compact FoveaWAM transformer layer with separate S, M and A state paths. A single masked attention operation spans all three paths. One World FFN spans S and M; the Action FFN acts on A. Each residual strip applies addition independently to the corresponding S, M and A partitions. Each side bypass transports the ordered tuple unchanged, without pooling, cross-stream addition or broadcasting one state to others. Pre-normalization and adaptive-normalization details are suppressed. The attention map remains external. Updated states feed the next layer. This standalone candidate does not replace Fig.2.</desc>
