<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#263b50"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7654a1"/></marker>
    <style>
      .title{font-size:25px;font-weight:700;fill:#172637}.head{font-size:23px;font-weight:700;fill:#263b50}
      .body{font-size:21px;fill:#334b60}.small{font-size:20px;fill:#526879}.center{text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="300" fill="#fff"/>
  <text x="18" y="29" class="title">One candidate world–action interface</text>
  <text x="1182" y="28" class="small" text-anchor="end">Candidate illustration; selection pending</text>
  <rect x="18" y="64" width="196" height="153" rx="9" fill="#f2f7fb" stroke="#8bb4d1" stroke-width="1.5"/>
  <text x="116" y="95" class="head center">Visible input</text>
  <text x="116" y="128" class="body center">RGB-D history</text>
  <text x="116" y="158" class="body center">calibration</text>
  <text x="116" y="188" class="body center">robot state</text>
  <line x1="217" y1="140" x2="244" y2="140" stroke="#263b50" stroke-width="2.5" marker-end="url(#aN)"/>
  <rect x="253" y="64" width="205" height="153" rx="9" fill="#eef8f5" stroke="#85c3b6" stroke-width="1.5"/>
  <text x="356" y="95" class="head center">History encoder</text>
  <text x="356" y="128" class="body center">visual + metric</text>
  <text x="356" y="158" class="body center">space + time</text>
  <text x="356" y="188" class="body center">validity masks</text>
  <line x1="461" y1="140" x2="488" y2="140" stroke="#263b50" stroke-width="2.5" marker-end="url(#aN)"/>
  <rect x="497" y="64" width="239" height="153" rx="9" fill="#f7f3fa" stroke="#baa2d0" stroke-width="1.5"/>
  <text x="617" y="95" class="head center">Candidate future</text>
  <text x="617" y="128" class="body center">target SE(3) / 3-D flow</text>
  <text x="617" y="158" class="body center">uncertainty (optional)</text>
  <text x="617" y="188" class="body center">execution-time targets</text>
  <line x1="739" y1="140" x2="775" y2="140" stroke="#7654a1" stroke-width="2.5" marker-end="url(#aP)"/>
  <rect x="784" y="64" width="211" height="153" rx="9" fill="#fff6ee" stroke="#e4b28c" stroke-width="1.5"/>
  <text x="890" y="95" class="head center">Action generator</text>
  <text x="890" y="128" class="body center">scene + future</text>
  <text x="890" y="158" class="body center">readable interface</text>
  <text x="890" y="188" class="body center">action chunk</text>
  <line x1="998" y1="140" x2="1025" y2="140" stroke="#263b50" stroke-width="2.5" marker-end="url(#aN)"/>
  <rect x="1034" y="64" width="148" height="153" rx="9" fill="#f0f4f7" stroke="#b0c0cc" stroke-width="1.5"/>
  <text x="1108" y="95" class="head center">Executor</text>
  <text x="1108" y="128" class="body center">time tags</text>
  <text x="1108" y="158" class="body center">action age</text>
  <text x="1108" y="188" class="body center">replanning</text>
  <path d="M356 220 V235 H890 V220" fill="none" stroke="#263b50" stroke-width="2" marker-end="url(#aN)"/>
  <rect x="469" y="224" width="309" height="24" fill="#fff"/>
  <text x="623" y="242" class="small center">current scene remains available</text>
