<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34495e"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2166ac"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b2182b"/>
    </marker>
    <style>
      .label{font-size:24px;fill:#17202a;font-weight:700}.small{font-size:19px;fill:#34495e}
      .tiny{font-size:16px;fill:#5d6d7e}.time{font-size:18px;fill:#263238;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="520" fill="#ffffff"/>

  <text x="34" y="42" class="label">Timestamped observation history</text>
  <line x1="58" y1="92" x2="1540" y2="92" stroke="#34495e" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="72" y="58" width="460" height="62" rx="14" fill="#edf4fb" stroke="#6baed6" stroke-width="2"/>
  <text x="302" y="83" text-anchor="middle" class="small">two-view RGB-D + robot/action history</text>
  <text x="302" y="108" text-anchor="middle" class="tiny">valid timestamps, no reset-frame padding</text>
  <line x1="600" y1="66" x2="600" y2="118" stroke="#34495e" stroke-width="3"/>
  <text x="600" y="48" text-anchor="middle" class="time">last observation  t</text>
  <rect x="648" y="61" width="490" height="56" rx="14" fill="#fff3d9" stroke="#e39d26" stroke-width="2"/>
  <text x="893" y="84" text-anchor="middle" class="small">capture + inference + queue + actuation</text>
  <text x="893" y="108" text-anchor="middle" class="tiny">measured delay  ell(t)</text>
  <line x1="1180" y1="66" x2="1180" y2="118" stroke="#34495e" stroke-width="3"/>
  <text x="1180" y="48" text-anchor="middle" class="time">first action applied</text>
  <text x="1450" y="48" text-anchor="middle" class="time">execution window</text>

  <rect x="24" y="148" width="1552" height="152" rx="18" fill="#fff4f4" stroke="#d6604d" stroke-width="2"/>
  <rect x="42" y="168" width="225" height="112" rx="14" fill="#ffffff" stroke="#b2182b" stroke-width="2"/>
  <text x="155" y="204" text-anchor="middle" class="label" fill="#b2182b">Reactive</text>
  <text x="155" y="235" text-anchor="middle" class="small">current pose -> action</text>
  <text x="155" y="263" text-anchor="middle" class="tiny">history may be implicit</text>

  <g transform="translate(318,176)">
    <rect x="0" y="34" width="86" height="58" rx="8" fill="#d9edf7" stroke="#4f81bd" stroke-width="2"/>
    <rect x="26" y="49" width="34" height="25" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
    <text x="43" y="116" text-anchor="middle" class="tiny">t-0.4</text>
    <rect x="112" y="34" width="86" height="58" rx="8" fill="#d9edf7" stroke="#4f81bd" stroke-width="2"/>
    <rect x="150" y="49" width="34" height="25" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
    <text x="155" y="116" text-anchor="middle" class="tiny">t-0.2</text>
    <rect x="224" y="34" width="86" height="58" rx="8" fill="#d9edf7" stroke="#4f81bd" stroke-width="2"/>
    <rect x="278" y="49" width="34" height="25" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
    <text x="267" y="116" text-anchor="middle" class="tiny">t</text>
  </g>
  <path d="M660 236 C790 236, 865 236, 980 236" fill="none" stroke="#b2182b" stroke-width="5" marker-end="url(#redArrow)"/>
  <rect x="1025" y="202" width="45" height="32" rx="5" fill="#f4a261" fill-opacity="0.35" stroke="#b2182b" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="1048" y="264" text-anchor="middle" class="tiny">stale target</text>
  <rect x="1260" y="202" width="45" height="32" rx="5" fill="#f4a261" stroke="#8a4b08" stroke-width="3"/>
  <text x="1282" y="264" text-anchor="middle" class="tiny">object now</text>
  <path d="M1115 186 q38 24 0 48 v30" fill="none" stroke="#394b59" stroke-width="10" stroke-linecap="round"/>
  <line x1="1100" y1="262" x2="1130" y2="262" stroke="#394b59" stroke-width="8"/>
  <line x1="1138" y1="218" x2="1240" y2="218" stroke="#b2182b" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="1450" y="225" text-anchor="middle" class="label" fill="#b2182b">MISS</text>
  <text x="1450" y="257" text-anchor="middle" class="small">target moved during ell(t)</text>

  <rect x="24" y="322" width="1552" height="174" rx="18" fill="#f1f8ff" stroke="#4393c3" stroke-width="2"/>
  <rect x="42" y="344" width="225" height="128" rx="14" fill="#ffffff" stroke="#2166ac" stroke-width="2"/>
  <text x="155" y="380" text-anchor="middle" class="label" fill="#2166ac">SE(3)-WAM</text>
  <text x="155" y="411" text-anchor="middle" class="small">history -> physical future</text>
  <text x="155" y="441" text-anchor="middle" class="tiny">metric + uncertainty + action</text>

  <g transform="translate(318,347)">
    <rect x="0" y="42" width="86" height="58" rx="8" fill="#d9edf7" stroke="#4f81bd" stroke-width="2"/>
    <rect x="26" y="57" width="34" height="25" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
    <rect x="112" y="42" width="86" height="58" rx="8" fill="#d9edf7" stroke="#4f81bd" stroke-width="2"/>
    <rect x="150" y="57" width="34" height="25" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
    <rect x="224" y="42" width="86" height="58" rx="8" fill="#d9edf7" stroke="#4f81bd" stroke-width="2"/>
    <rect x="278" y="57" width="34" height="25" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
    <path d="M42 60 C120 15, 205 16, 286 58" fill="none" stroke="#2166ac" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="155" y="126" text-anchor="middle" class="tiny">motion identifiable from history</text>
  </g>
  <rect x="710" y="350" width="300" height="126" rx="14" fill="#ffffff" stroke="#2166ac" stroke-width="2"/>
  <text x="860" y="378" text-anchor="middle" class="label">execution-aligned future</text>
  <text x="860" y="411" text-anchor="middle" class="small">target SE(3) ghosts  +  3-D flow</text>
  <g opacity="0.35">
    <rect x="758" y="430" width="34" height="24" rx="4" fill="#f4a261" transform="rotate(-12 775 442)"/>
    <rect x="830" y="426" width="34" height="24" rx="4" fill="#f4a261" transform="rotate(-5 847 438)"/>
  </g>
  <rect x="906" y="420" width="38" height="28" rx="4" fill="#f4a261" stroke="#8a4b08" stroke-width="2"/>
  <path d="M1015 412 C1095 412, 1145 412, 1215 412" fill="none" stroke="#2166ac" stroke-width="5" marker-end="url(#blueArrow)"/>
  <path d="M1265 362 q38 24 0 48 v30" fill="none" stroke="#394b59" stroke-width="10" stroke-linecap="round"/>
  <line x1="1250" y1="438" x2="1280" y2="438" stroke="#394b59" stroke-width="8"/>
  <rect x="1287" y="416" width="45" height="32" rx="5" fill="#f4a261" stroke="#8a4b08" stroke-width="3"/>
  <text x="1445" y="389" text-anchor="middle" class="label" fill="#2166ac">INTERCEPT</text>
  <text x="1445" y="425" text-anchor="middle" class="small">action reads forecast</text>
  <text x="1445" y="458" text-anchor="middle" class="tiny">causal audit: zero / swap / noise</text>
</svg>
