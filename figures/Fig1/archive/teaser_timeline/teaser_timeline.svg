<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="clockArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#263b50"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1465a8"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7654a1"/></marker>
    <style>
      .title{font-size:25px;font-weight:700;fill:#172637}.head{font-size:22px;font-weight:700;fill:#263b50}
      .body{font-size:21px;fill:#334b60}.small{font-size:20px;fill:#526879}.center{text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="290" fill="#fff"/>
  <text x="18" y="29" class="title">The observation–execution gap</text>
  <text x="1180" y="28" class="small" text-anchor="end">Conceptual illustration; no measured outcome</text>
  <rect x="20" y="48" width="355" height="35" rx="6" fill="#eaf3fa"/>
  <rect x="375" y="48" width="425" height="35" fill="#fff1dc"/>
  <rect x="800" y="48" width="380" height="35" rx="6" fill="#eaf6ef"/>
  <text x="198" y="73" class="body center">timestamped history</text>
  <text x="587" y="73" class="body center">capture → compute → queue</text>
  <text x="990" y="73" class="body center">execution window</text>
  <line x1="20" y1="92" x2="1180" y2="92" stroke="#263b50" stroke-width="2.5" marker-end="url(#clockArrow)"/>
  <line x1="375" y1="43" x2="375" y2="99" stroke="#263b50" stroke-width="2"/>
  <line x1="800" y1="43" x2="800" y2="99" stroke="#263b50" stroke-width="2"/>
  <text x="375" y="119" class="small center">last observation t_s</text>
  <text x="800" y="119" class="small center">first action t_s + delay</text>
  <rect x="20" y="136" width="355" height="110" rx="9" fill="#f6f9fc" stroke="#bdd2e3" stroke-width="1.5"/>
  <text x="37" y="163" class="head">Observed motion</text>
  <g fill="#fff" stroke="#91b4cf" stroke-width="1.5">
    <rect x="38" y="176" width="90" height="50" rx="5"/>
    <rect x="151" y="176" width="90" height="50" rx="5"/>
    <rect x="264" y="176" width="90" height="50" rx="5"/>
  </g>
  <g fill="#e89643" stroke="#8a4b08" stroke-width="1.5">
    <rect x="61" y="194" width="27" height="18" rx="3" transform="rotate(-10 74 203)"/>
    <rect x="184" y="192" width="27" height="18" rx="3" transform="rotate(-4 197 201)"/>
    <rect x="306" y="190" width="27" height="18" rx="3"/>
  </g>
  <path d="M88 190 C160 164 242 164 306 185" fill="none" stroke="#1465a8" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <rect x="412" y="136" width="768" height="110" rx="9" fill="#faf8fc" stroke="#d3c6e1" stroke-width="1.5"/>
  <text x="430" y="163" class="head">Possible futures at action time</text>
  <rect x="457" y="197" width="28" height="19" rx="3" fill="#e89643" stroke="#8a4b08" stroke-width="1.5"/>
  <path d="M489 202 C580 179 657 177 748 181" fill="none" stroke="#1465a8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#blueArrow)"/>
  <path d="M489 211 C580 231 657 234 748 224" fill="none" stroke="#7654a1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#purpleArrow)"/>
  <rect x="764" y="173" width="29" height="19" rx="3" fill="#e89643" fill-opacity="0.35" stroke="#1465a8" stroke-width="2"/>
  <rect x="764" y="214" width="29" height="19" rx="3" fill="#e89643" fill-opacity="0.35" stroke="#7654a1" stroke-width="2" transform="rotate(15 779 223)"/>
  <text x="817" y="188" class="body">motion / interaction condition A</text>
  <text x="817" y="229" class="body">motion / interaction condition B</text>
  <text x="20" y="276" class="body">Q1–Q3 compare how history, future representation, and world–action interaction affect control.</text>
</svg>
