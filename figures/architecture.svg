<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#34495e"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2166ac"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d95f02"/></marker>
    <style>
      .title{font-size:25px;font-weight:700;fill:#17202a}.h{font-size:21px;font-weight:700;fill:#17202a}
      .s{font-size:17px;fill:#34495e}.xs{font-size:15px;fill:#566573}.tag{font-size:15px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#fff"/>
  <text x="28" y="40" class="title">Inference: one feed-forward world pass, one-way physical bridge, continuous action execution</text>

  <rect x="25" y="70" width="230" height="415" rx="16" fill="#eef5fb" stroke="#4f81bd" stroke-width="2.5"/>
  <rect x="42" y="88" width="196" height="42" rx="10" fill="#4f81bd"/>
  <text x="140" y="116" text-anchor="middle" class="tag">TIMESTAMPED INPUT</text>
  <rect x="48" y="150" width="184" height="92" rx="10" fill="#fff" stroke="#78a7d1" stroke-width="2"/>
  <text x="140" y="178" text-anchor="middle" class="h">two-view RGB-D</text>
  <text x="140" y="205" text-anchor="middle" class="s">C1 / C2 / C3 / C9</text>
  <text x="140" y="229" text-anchor="middle" class="xs">0.4 s maximum history</text>
  <rect x="48" y="260" width="184" height="84" rx="10" fill="#fff" stroke="#78a7d1" stroke-width="2"/>
  <text x="140" y="289" text-anchor="middle" class="h">robot + gripper</text>
  <text x="140" y="316" text-anchor="middle" class="s">issued / applied action</text>
  <text x="140" y="337" text-anchor="middle" class="xs">state and action ages</text>
  <rect x="48" y="362" width="184" height="92" rx="10" fill="#fff" stroke="#78a7d1" stroke-width="2"/>
  <text x="140" y="391" text-anchor="middle" class="h">calibration + task ID</text>
  <text x="140" y="420" text-anchor="middle" class="s">K, depth scale, extrinsics</text>
  <text x="140" y="443" text-anchor="middle" class="xs">validity mask; no future GT</text>

  <line x1="257" y1="278" x2="292" y2="278" stroke="#34495e" stroke-width="4" marker-end="url(#a)"/>
  <rect x="300" y="70" width="270" height="415" rx="16" fill="#e8f5ef" stroke="#2a9d8f" stroke-width="2.5"/>
  <rect x="318" y="88" width="234" height="42" rx="10" fill="#2a9d8f"/>
  <text x="435" y="116" text-anchor="middle" class="tag">METRIC 3-D ENCODER</text>
  <rect x="325" y="150" width="220" height="86" rx="10" fill="#fff" stroke="#55b6a9" stroke-width="2"/>
  <text x="435" y="178" text-anchor="middle" class="h">frozen DINOv3</text>
  <text x="435" y="206" text-anchor="middle" class="s">14 x 14 patch features</text>
  <text x="435" y="228" text-anchor="middle" class="xs">shared across views / time</text>
  <line x1="435" y1="240" x2="435" y2="268" stroke="#2a9d8f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="325" y="274" width="220" height="86" rx="10" fill="#fff" stroke="#55b6a9" stroke-width="2"/>
  <text x="435" y="303" text-anchor="middle" class="h">depth lift to base XYZ</text>
  <text x="435" y="331" text-anchor="middle" class="s">3-D position + view + age</text>
  <text x="435" y="353" text-anchor="middle" class="xs">time-varying wrist extrinsic</text>
  <line x1="435" y1="364" x2="435" y2="390" stroke="#2a9d8f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="325" y="396" width="220" height="62" rx="10" fill="#fff" stroke="#55b6a9" stroke-width="2"/>
  <text x="435" y="423" text-anchor="middle" class="h">spatial + temporal TF</text>
  <text x="435" y="449" text-anchor="middle" class="xs">true time offsets and valid mask</text>

  <line x1="572" y1="278" x2="607" y2="278" stroke="#34495e" stroke-width="4" marker-end="url(#a)"/>
  <rect x="615" y="70" width="335" height="415" rx="16" fill="#f2ecf9" stroke="#7b5aa6" stroke-width="2.5"/>
  <rect x="633" y="88" width="299" height="42" rx="10" fill="#7b5aa6"/>
  <text x="782" y="116" text-anchor="middle" class="tag">PHYSICAL WORLD EXPERT</text>
  <rect x="640" y="150" width="285" height="108" rx="10" fill="#fff" stroke="#9b79bd" stroke-width="2"/>
  <text x="782" y="179" text-anchor="middle" class="h">target-centric SE(3)</text>
  <text x="782" y="207" text-anchor="middle" class="s">8 poses at execution timestamps</text>
  <text x="782" y="234" text-anchor="middle" class="s">translation + SO(3) uncertainty</text>
  <rect x="640" y="276" width="285" height="108" rx="10" fill="#fff" stroke="#9b79bd" stroke-width="2"/>
  <text x="782" y="305" text-anchor="middle" class="h">dense metric 3-D flow</text>
  <text x="782" y="333" text-anchor="middle" class="s">patch x horizon displacement</text>
  <text x="782" y="360" text-anchor="middle" class="s">validity + uncertainty</text>
  <rect x="640" y="402" width="285" height="56" rx="10" fill="#fff" stroke="#9b79bd" stroke-width="2"/>
  <text x="782" y="427" text-anchor="middle" class="h">SE(3) / flow consistency</text>
  <text x="782" y="450" text-anchor="middle" class="xs">direct regression default</text>

  <line x1="952" y1="278" x2="987" y2="278" stroke="#2166ac" stroke-width="5" marker-end="url(#ab)"/>
  <rect x="995" y="112" width="205" height="330" rx="16" fill="#fff4dc" stroke="#e39d26" stroke-width="2.5"/>
  <rect x="1013" y="130" width="169" height="42" rx="10" fill="#e39d26"/>
  <text x="1097" y="158" text-anchor="middle" class="tag">PHYSICAL REDUCER</text>
  <text x="1097" y="205" text-anchor="middle" class="h">fixed-size interface</text>
  <text x="1097" y="233" text-anchor="middle" class="s">relative target pose</text>
  <text x="1097" y="258" text-anchor="middle" class="s">velocity + pooled flow</text>
  <text x="1097" y="283" text-anchor="middle" class="s">uncertainty + time + TTC</text>
  <g fill="#ffd166" stroke="#9a6b00" stroke-width="2">
    <circle cx="1035" cy="330" r="17"/><circle cx="1078" cy="330" r="17"/><circle cx="1121" cy="330" r="17"/><circle cx="1164" cy="330" r="17"/>
    <circle cx="1035" cy="378" r="17"/><circle cx="1078" cy="378" r="17"/><circle cx="1121" cy="378" r="17"/><circle cx="1164" cy="378" r="17"/>
  </g>
  <text x="1097" y="426" text-anchor="middle" class="xs">z1 ... z8, horizon identity retained</text>

  <line x1="1202" y1="278" x2="1237" y2="278" stroke="#d95f02" stroke-width="5" marker-end="url(#ao)"/>
  <rect x="1245" y="112" width="205" height="330" rx="16" fill="#fff0e8" stroke="#d95f02" stroke-width="2.5"/>
  <rect x="1263" y="130" width="169" height="42" rx="10" fill="#d95f02"/>
  <text x="1347" y="158" text-anchor="middle" class="tag">ACTION EXPERT</text>
  <text x="1347" y="206" text-anchor="middle" class="h">action queries</text>
  <text x="1347" y="235" text-anchor="middle" class="s">cross-attend to z1 ... z8</text>
  <rect x="1273" y="265" width="148" height="82" rx="10" fill="#fff" stroke="#ed8b55" stroke-width="2"/>
  <text x="1347" y="294" text-anchor="middle" class="h">flow matching</text>
  <text x="1347" y="322" text-anchor="middle" class="s">E7 action chunk</text>
  <text x="1347" y="342" text-anchor="middle" class="xs">8 x 7 at 20 Hz</text>
  <rect x="1273" y="367" width="148" height="52" rx="10" fill="#fff" stroke="#ed8b55" stroke-width="2"/>
  <text x="1347" y="397" text-anchor="middle" class="s">detached -> E2E ablation</text>

  <line x1="1452" y1="278" x2="1480" y2="278" stroke="#34495e" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1487" y="150" width="92" height="256" rx="14" fill="#edf2f4" stroke="#607d8b" stroke-width="2.5"/>
  <text x="1533" y="184" text-anchor="middle" class="h">newest</text>
  <text x="1533" y="210" text-anchor="middle" class="h">wins</text>
  <text x="1533" y="252" text-anchor="middle" class="xs">tag</text>
  <text x="1533" y="273" text-anchor="middle" class="xs">discard</text>
  <text x="1533" y="294" text-anchor="middle" class="xs">replace</text>
  <path d="M1510 332 h46 M1510 352 h32 M1510 372 h20" stroke="#607d8b" stroke-width="7" stroke-linecap="round"/>

  <rect x="25" y="520" width="1554" height="172" rx="16" fill="#fafafa" stroke="#7f8c8d" stroke-width="2"/>
  <text x="46" y="555" class="title">Training-only supervision and causal audit</text>
  <line x1="620" y1="565" x2="620" y2="672" stroke="#bdc3c7" stroke-width="2"/>
  <text x="55" y="598" class="h">metric losses</text>
  <text x="55" y="628" class="s">pose NLL + flow NLL + rigid consistency + action FM</text>
  <text x="55" y="658" class="xs">future labels masked after unmatched robot contact</text>
  <text x="650" y="598" class="h">world decoder ablations</text>
  <text x="650" y="628" class="s">direct regression | standard FM | Residual-SPDF</text>
  <text x="650" y="658" class="xs">same NFE, parameters, data, and physical horizons</text>
  <line x1="1110" y1="565" x2="1110" y2="672" stroke="#bdc3c7" stroke-width="2"/>
  <text x="1140" y="598" class="h">intervene on z only</text>
  <text x="1140" y="628" class="s">zero | exact-current swap | calibrated noise | oracle</text>
  <text x="1140" y="658" class="xs">measure action change, SR, safety, and timing</text>
</svg>
