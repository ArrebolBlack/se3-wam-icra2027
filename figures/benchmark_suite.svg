<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 29px; font-weight: 700; fill: #ffffff; }
      .card-title { font-size: 24px; font-weight: 700; fill: #17202a; }
      .task-id { font-size: 19px; font-weight: 700; fill: #203040; }
      .body { font-size: 18px; fill: #34495e; }
      .small { font-size: 16px; fill: #60717d; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .footer-head { font-size: 21px; font-weight: 700; fill: #203040; }
      .footer { font-size: 17px; fill: #455a64; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>
  <rect x="20" y="16" width="1560" height="50" rx="14" fill="#263b50"/>
  <text x="800" y="50" text-anchor="middle" class="title">DB0 v0.4 · Active-Full-13-v0.3 · representative frozen environment views</text>

  <!-- Reusable card pattern: 150 px square agent-RGB crop + editable task contract. -->
  <g transform="translate(20,80)">
    <rect width="375" height="214" rx="14" fill="#f7faff" stroke="#4f81bd" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#4f81bd"/><text x="32" y="35" text-anchor="middle" class="badge">P0</text>
    <text x="58" y="37" class="card-title">Future Pose</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/p0.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">P0</text>
    <text x="178" y="114" class="body">robot still</text><text x="178" y="142" class="body">8 future SE(3)</text><text x="178" y="170" class="body">50–400 ms</text>
    <text x="178" y="199" class="small">forecast only</text>
  </g>

  <g transform="translate(415,80)">
    <rect width="375" height="214" rx="14" fill="#f7fcf8" stroke="#4c9a5f" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#4c9a5f"/><text x="32" y="35" text-anchor="middle" class="badge">T1</text>
    <text x="58" y="37" class="card-title">Belt Capture</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t1_belt.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T1-Belt</text>
    <text x="178" y="114" class="body">intercept</text><text x="178" y="142" class="body">grasp + lift</text><text x="178" y="170" class="body">stable hold</text>
    <text x="178" y="199" class="small">moving support</text>
  </g>

  <g transform="translate(810,80)">
    <rect width="375" height="214" rx="14" fill="#faf8fd" stroke="#8060a8" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#8060a8"/><text x="32" y="35" text-anchor="middle" class="badge">T1</text>
    <text x="58" y="37" class="card-title">SE(3) Split</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/t1_so3.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T1-XYZ / SO3</text>
    <text x="178" y="114" class="body">matched XYZ</text><text x="178" y="142" class="body">independent yaw</text><text x="178" y="170" class="body">causal contrast</text>
    <text x="178" y="199" class="small">T-shaped target</text>
  </g>

  <g transform="translate(1205,80)">
    <rect width="375" height="214" rx="14" fill="#faf8fd" stroke="#8060a8" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#8060a8"/><text x="32" y="35" text-anchor="middle" class="badge">T1</text>
    <text x="58" y="37" class="card-title">Occlusion</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t1_occ.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T1-OCC</text>
    <text x="178" y="114" class="body">physical screen</text><text x="178" y="142" class="body">hidden interval</text><text x="178" y="170" class="body">history needed</text>
    <text x="178" y="199" class="small">no pose oracle</text>
  </g>

  <g transform="translate(20,310)">
    <rect width="375" height="214" rx="14" fill="#fffbf4" stroke="#d98c2b" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#d98c2b"/><text x="32" y="35" text-anchor="middle" class="badge">T2</text>
    <text x="58" y="37" class="card-title">Moving Goal</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/t2_se3.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T2-TRANS / SE3</text>
    <text x="178" y="114" class="body">future release</text><text x="178" y="142" class="body">containment</text><text x="178" y="170" class="body">settle + dwell</text>
    <text x="178" y="199" class="small">moving receptacle</text>
  </g>

  <g transform="translate(415,310)">
    <rect width="375" height="214" rx="14" fill="#fff8f8" stroke="#bf4d4d" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#bf4d4d"/><text x="32" y="35" text-anchor="middle" class="badge">T3</text>
    <text x="58" y="37" class="card-title">Buzz Wire</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t3_phase.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T3-Phase / Full</text>
    <text x="178" y="114" class="body">phase align</text><text x="178" y="142" class="body">traverse loop</text><text x="178" y="170" class="body">no wire touch</text>
    <text x="178" y="199" class="small">rotating obstacle</text>
  </g>

  <g transform="translate(810,310)">
    <rect width="375" height="214" rx="14" fill="#f5fcfd" stroke="#2f8999" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#2f8999"/><text x="32" y="35" text-anchor="middle" class="badge">T4</text>
    <text x="58" y="37" class="card-title">Free Physics</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t4_can.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T4-Sphere</text><text x="178" y="106" class="task-id">Slider / Can</text>
    <text x="178" y="142" class="body">ramp exit</text><text x="178" y="170" class="body">unsupported catch</text>
    <text x="178" y="199" class="small">roll / slide / slip</text>
  </g>

  <g transform="translate(1205,310)">
    <rect width="375" height="214" rx="14" fill="#f8f9fa" stroke="#596b75" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="18" fill="#596b75"/><text x="32" y="35" text-anchor="middle" class="badge">T5</text>
    <text x="58" y="37" class="card-title">Impact Replan</text>
    <svg x="12" y="52" width="150" height="150" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/t5_replan.png"/></svg>
    <rect x="12" y="52" width="150" height="150" fill="none" stroke="#d3dce4" stroke-width="1.5"/>
    <text x="178" y="78" class="task-id">T5-Replan</text>
    <text x="178" y="114" class="body">branch impact</text><text x="178" y="142" class="body">observe + correct</text><text x="178" y="170" class="body">keyed grasp</text>
    <text x="178" y="199" class="small">post-event state</text>
  </g>

  <rect x="20" y="544" width="1560" height="58" rx="12" fill="#f4f6f7" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="42" y="569" class="footer-head">Shared physical clock</text>
  <text x="42" y="594" class="footer">20 Hz RGB-D/control · 500 Hz physics · waiting, inference, actuation, contact, and dwell all consume time</text>
  <line x1="1000" y1="552" x2="1000" y2="594" stroke="#c0c8cc" stroke-width="2"/>
  <text x="1025" y="569" class="footer-head">Separate reports</text>
  <text x="1025" y="594" class="footer">forecast · SR · TC · CT · safety · latency</text>
</svg>
