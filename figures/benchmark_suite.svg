<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .group{font-size:22px;font-weight:700;fill:#fff}.task{font-size:20px;font-weight:700;fill:#172637}
      .id{font-size:15px;font-weight:700;fill:#445b6d}.body{font-size:16px;fill:#334b60}.small{font-size:14px;fill:#617487}
      .factor{font-size:17px;font-weight:700;fill:#263b50}.center{text-anchor:middle}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="600" fill="#fff"/>

  <!-- Three evaluation tiers. -->
  <rect x="20" y="18" width="185" height="40" rx="10" fill="#477fae"/>
  <text x="112" y="45" class="group center">FORECAST</text>
  <rect x="215" y="18" width="965" height="40" rx="10" fill="#324f68"/>
  <text x="697" y="45" class="group center">DB0 CORE: CLOSED-LOOP DYNAMIC MANIPULATION</text>
  <rect x="1190" y="18" width="380" height="40" rx="10" fill="#51636f"/>
  <text x="1380" y="45" class="group center">PHYSICS + EVENT STRESS</text>

  <!-- P0 -->
  <g transform="translate(20,74)">
    <rect width="185" height="252" rx="9" fill="#f4f8fc"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/p0.png"/></svg>
    <rect x="0" y="0" width="185" height="160" fill="none" stroke="#477fae" stroke-width="2"/>
    <text x="12" y="188" class="id">P0</text>
    <text x="12" y="214" class="task">Future Pose</text>
    <text x="12" y="239" class="small">8 poses, 50-400 ms</text>
  </g>

  <!-- Core montage. -->
  <g transform="translate(215,74)">
    <rect width="185" height="252" rx="9" fill="#f3faf5"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t1_belt.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#4b9a61" stroke-width="2"/>
    <text x="12" y="188" class="id">T1-BELT</text><text x="12" y="214" class="task">Intercept</text><text x="12" y="239" class="small">grasp + lift + hold</text>
  </g>
  <g transform="translate(410,74)">
    <rect width="185" height="252" rx="9" fill="#f7f4fa"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/t1_so3.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#8060a8" stroke-width="2"/>
    <text x="12" y="188" class="id">T1-XYZ / SO3</text><text x="12" y="214" class="task">Orientation</text><text x="12" y="239" class="small">matched centroid motion</text>
  </g>
  <g transform="translate(605,74)">
    <rect width="185" height="252" rx="9" fill="#f7f4fa"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t1_occ.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#8060a8" stroke-width="2"/>
    <text x="12" y="188" class="id">T1-OCC</text><text x="12" y="214" class="task">Occlusion</text><text x="12" y="239" class="small">physical hidden interval</text>
  </g>
  <g transform="translate(800,74)">
    <rect width="185" height="252" rx="9" fill="#fff9f1"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/t2_se3.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#d98c2b" stroke-width="2"/>
    <text x="12" y="188" class="id">T2-TRANS / SE3</text><text x="12" y="214" class="task">Moving Goal</text><text x="12" y="239" class="small">release + settle + dwell</text>
  </g>
  <g transform="translate(995,74)">
    <rect width="185" height="252" rx="9" fill="#fff5f5"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t3_phase.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#bf4d4d" stroke-width="2"/>
    <text x="12" y="188" class="id">T3-PHASE / FULL</text><text x="12" y="214" class="task">Buzz Wire</text><text x="12" y="239" class="small">phase align, no touch</text>
  </g>

  <!-- Stress tests. -->
  <g transform="translate(1190,74)">
    <rect width="185" height="252" rx="9" fill="#f3fbfc"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 72 224 224" overflow="hidden"><image width="672" height="538" xlink:href="benchmark_frames/t4_can.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#2f8999" stroke-width="2"/>
    <text x="12" y="188" class="id" style="font-size:12px">T4-SPHERE / SLIDER / CAN</text><text x="12" y="214" class="task">Free Physics</text><text x="12" y="239" class="small">roll / slide / slip</text>
  </g>
  <g transform="translate(1385,74)">
    <rect width="185" height="252" rx="9" fill="#f6f7f8"/>
    <svg x="0" y="0" width="185" height="160" viewBox="0 88 224 224" overflow="hidden"><image width="448" height="630" xlink:href="benchmark_frames/t5_replan.png"/></svg>
    <rect width="185" height="160" fill="none" stroke="#596b75" stroke-width="2"/>
    <text x="12" y="188" class="id">T5-REPLAN</text><text x="12" y="214" class="task">Impact Replan</text><text x="12" y="239" class="small">observe + correct + grasp</text>
  </g>

  <!-- Causal factors rather than repeated card prose. -->
  <text x="24" y="370" class="factor">Isolated factors</text>
  <line x1="170" y1="363" x2="1570" y2="363" stroke="#d7e0e6" stroke-width="2"/>
  <g transform="translate(20,389)">
    <rect x="0" y="0" width="240" height="72" rx="12" fill="#edf4fa"/>
    <circle cx="27" cy="26" r="8" fill="#477fae"/><text x="46" y="31" class="body bold">observability</text>
    <text x="27" y="56" class="small">current vs. valid history</text>
  </g>
  <g transform="translate(280,389)">
    <rect x="0" y="0" width="240" height="72" rx="12" fill="#f5f0f9"/>
    <circle cx="27" cy="26" r="8" fill="#8060a8"/><text x="46" y="31" class="body bold">orientation</text>
    <text x="27" y="56" class="small">same XYZ, independent yaw</text>
  </g>
  <g transform="translate(540,389)">
    <rect x="0" y="0" width="240" height="72" rx="12" fill="#f5f0f9"/>
    <circle cx="27" cy="26" r="8" fill="#8060a8"/><text x="46" y="31" class="body bold">visibility</text>
    <text x="27" y="56" class="small">physical occlusion interval</text>
  </g>
  <g transform="translate(800,389)">
    <rect x="0" y="0" width="240" height="72" rx="12" fill="#fff7ea"/>
    <circle cx="27" cy="26" r="8" fill="#d98c2b"/><text x="46" y="31" class="body bold">time-to-contact</text>
    <text x="27" y="56" class="small">speed x delay x TTC</text>
  </g>
  <g transform="translate(1060,389)">
    <rect x="0" y="0" width="240" height="72" rx="12" fill="#eef9fa"/>
    <circle cx="27" cy="26" r="8" fill="#2f8999"/><text x="46" y="31" class="body bold">free dynamics</text>
    <text x="27" y="56" class="small">gravity, friction, contact</text>
  </g>
  <g transform="translate(1320,389)">
    <rect x="0" y="0" width="250" height="72" rx="12" fill="#f2f4f5"/>
    <circle cx="27" cy="26" r="8" fill="#596b75"/><text x="46" y="31" class="body bold">unannounced event</text>
    <text x="27" y="56" class="small">impact then re-observe</text>
  </g>

  <!-- Shared contract. -->
  <rect x="20" y="490" width="1550" height="88" rx="14" fill="#263b50"/>
  <text x="50" y="523" class="group">ONE PHYSICAL CLOCK</text>
  <text x="50" y="554" class="body white">20 Hz RGB-D and control   |   500 Hz physics   |   sensing, inference, actuation, contact, and dwell all consume time</text>
  <line x1="1160" y1="506" x2="1160" y2="562" stroke="#708495" stroke-width="2"/>
  <text x="1190" y="523" class="group">PAIRED REPORTS</text>
  <text x="1190" y="554" class="body white">forecast | SR | TC | CT | safety | latency</text>
</svg>
